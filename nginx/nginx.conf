limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

server {
    listen 80 default_server;

    server_tokens off;

    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    client_max_body_size 6m;

    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        rewrite ^/api(.*)$ $1 break;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Статика фронта: /assets/, /logo.svg, /vite.svg и т.п.
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/app;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Изображения из бэкенда: /images/* через /api/images/*
    location ~* \.(json|ico)$ {
        root /var/public/;
        try_files $uri $uri/ =404;
    }

    location / {
        root /var/app;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}