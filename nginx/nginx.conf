# Зона rate limiting: 30 запросов в секунду с одного IP, размер зоны 10 МБ
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

server {
    listen 80 default_server;

    # Скрываем версию nginx в ответах и ошибках
    server_tokens off;

    # Логи с буферизацией — меньше I/O
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # Согласовано с лимитом multer (5 МБ) + небольшой запас
    client_max_body_size 6m;

    # Таймауты — защита от медленных атак
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    location /api/ {
        # Rate limiting: 30 запросов/сек, до 60 в очереди, потом 429
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;

        rewrite ^/api(.*)$ $1 break;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты к бэкенду
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ~* \.(json|ico)$ {
        root /var/public/;
        try_files $uri $uri/ =404;
    }

    location / {
        root /var/app;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}